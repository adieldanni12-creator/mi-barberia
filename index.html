<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barbería</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="card-container">
        <!-- Encabezado / Branding -->
        <header class="header">
            <div class="profile-img">
                <i class="fa-solid fa-scissors logo-icon"></i>
            </div>
            <h1 id="shop-name">Cargando...</h1>
            <p class="tagline" id="shop-tagline">...</p>
        </header>

        <!-- Botones de Acción -->
        <section class="action-buttons">
            <a id="btn-call" href="#" class="btn btn-call">
                <i class="fa-solid fa-phone"></i> Llamar
            </a>
            <a id="btn-wa" href="#" target="_blank" class="btn btn-whatsapp">
                <i class="fa-brands fa-whatsapp"></i> WhatsApp
            </a>
        </section>

        <!-- Pestañas -->
        <nav class="tab-nav">
            <button class="tab-btn active" onclick="switchTab('services')"><i class="fa-solid fa-list"></i> Menú / Servicios</button>
            <button class="tab-btn" onclick="switchTab('gallery')"><i class="fa-solid fa-image"></i> Galería</button>
        </nav>

        <!-- Menú -->
        <section id="services-tab" class="tab-content active">
            <h2>Nuestros Servicios</h2>
            <div class="service-list" id="services-container">
                <p>Cargando menú...</p>
            </div>
        </section>

        <!-- Galería -->
        <section id="gallery-tab" class="tab-content">
            <h2>Trabajos Recientes</h2>
            <div class="gallery-grid" id="gallery-container">
                <p>Cargando galería...</p>
            </div>
        </section>

        <!-- Redes Sociales -->
        <section class="social-links">
            <h3>Síguenos</h3>
            <div class="social-icons">
                <a id="link-ig" href="#" target="_blank" class="social-btn instagram"><i class="fa-brands fa-instagram"></i></a>
                <a id="link-tt" href="#" target="_blank" class="social-btn tiktok"><i class="fa-brands fa-tiktok"></i></a>
                <a id="link-fb" href="#" target="_blank" class="social-btn facebook"><i class="fa-brands fa-facebook-f"></i></a>
            </div>
        </section>

        <!-- Ubicación -->
        <section class="location-section">
            <h3>Ubicación</h3>
            <p><i class="fa-solid fa-location-dot"></i> <span id="shop-location">...</span></p>
            <a id="btn-maps" href="#" target="_blank" class="btn btn-maps">
                <i class="fa-solid fa-map-location-dot"></i> Ver en Google Maps
            </a>
        </section>

        <!-- Compartir y QR -->
        <section class="share-section">
            <button class="btn btn-share" onclick="sharePage()">
                <i class="fa-solid fa-share-nodes"></i> Compartir Perfil
            </button>
            <button class="btn btn-qr" onclick="toggleQR()">
                <i class="fa-solid fa-qrcode"></i> Mostrar Código QR
            </button>

            <div id="qr-modal" class="qr-container hidden">
                <p>Escanea para abrir en tu celular:</p>
                <img id="qr-image" src="" alt="Código QR">
            </div>
        </section>

        <footer class="footer">
            <p>&copy; 2026 <span id="footer-name">Barbería</span>. Todos los derechos reservados.</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
